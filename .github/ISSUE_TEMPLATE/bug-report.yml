name: Bug report
description: Something in Tesota doesn't work as its docs say
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search the [open issues](https://github.com/sequelcore/tesota/issues) first.
        Remove private code, credentials and secrets from everything you paste. Report a vulnerability
        privately instead: see [SECURITY.md](https://github.com/sequelcore/tesota/blob/dev/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tesota version
      description: From `tesota --version`, or the version the receipt names.
      placeholder: 0.1.0-alpha.3
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: Ghostty, WezTerm, Windows Terminal
  - type: input
    id: model
    attributes:
      label: Model
      description: The model the session ran on, as `provider/model`, from `/model` or the footer.
  - type: textarea
    id: receipt
    attributes:
      label: Receipt or session
      description: |
        If the bug is in a run, paste its receipt, or the relevant part of the session file.
        Check it for private code and secrets first.
      render: text
