name: Tesota checks
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: dafny --version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run vendor
      - run: bun --no-env-file run check
      - run: bun --no-env-file run formal:check
      - run: bun packages/core/src/main.ts --version
  # Linux with musl, as Alpine has it (#472): the engine's sessions and their lock, and the command starting. JavaScript
  # actions do not run in an Alpine container, so the checkout runs on the runner and the checks in Bun's Alpine image.
  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sessions and the command on Alpine
        run: |
          bun_version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          docker run --rm -v "$PWD:/tesota" -w /tesota "oven/bun:${bun_version}-alpine" sh -euc '
            apk add --no-cache git
            bun install --frozen-lockfile --ignore-scripts
            bun run vendor
            cd packages/core
            bun run test tests/session.test.ts
            bun src/main.ts --version'
