name: Tesota checks
# Spike for #556, not to merge: only the budget, on eight Windows and eight Linux runners, printing every sample.
on:
  pull_request:
permissions:
  contents: read
jobs:
  samples:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        runner: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run vendor
      - run: bun scripts/isolated.ts bun scripts/budget.ts --report
        working-directory: packages/core
      # Again on the same runner, as the budget's retry measures everything a second time.
      - run: bun scripts/isolated.ts bun scripts/budget.ts --report
        working-directory: packages/core
